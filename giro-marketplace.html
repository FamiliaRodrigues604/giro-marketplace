<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0a0d0b;
    --paper-2:#111613;
    --card:#121815;
    --ink:#e8fbf0;
    --ink-soft:#7d9a8c;
    --line:#20302a;
    --forest:#31ff8a;
    --forest-deep:#1fcf6e;
    --gold:#2fd8ff;
    --gold-soft:#0e2830;
    --coral:#ff2f5e;
    --coral-soft:#2c0f16;
    --mint:#0e2418;
    --amber:#2fd8ff;
    --amber-soft:#0e2830;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 0 24px -6px rgba(49,255,138,.12);
    --display:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --body:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(1000px 560px at 88% -8%, rgba(49,255,138,.07), transparent 60%),
      radial-gradient(800px 480px at -8% 108%, rgba(47,216,255,.06), transparent 55%),
      var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .v, .amt, .kv b, .stat .v{ font-family:var(--mono) !important; }
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .seal{width:46px;height:46px;border-radius:50%;background:var(--forest);color:#03150c;
    display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;
    box-shadow:0 0 22px -2px rgba(49,255,138,.6);flex:none}
  .brand h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1.05}
  .brand .sub{font-size:13px;color:var(--ink-soft)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:24px}
  nav.tabs button{border:none;background:transparent;cursor:pointer;font-family:var(--body);font-weight:600;
    font-size:14.5px;color:var(--ink-soft);padding:11px 16px;border-radius:10px 10px 0 0;position:relative;transition:color .15s}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--forest)}
  nav.tabs button.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-2px;height:3px;
    background:var(--forest);border-radius:3px}

  section{display:none;animation:rise .35s ease both}
  section.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.3fr .7fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .itemcard{box-shadow:0 0 0 1px var(--line) inset}
  .card h3{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .stat{padding:18px}
  .stat .k{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
  .stat .v{font-family:var(--display);font-size:28px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat .v.pos{color:var(--forest)}
  .stat .v.neg{color:var(--coral)}
  .stat .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .stat.accent{background:linear-gradient(160deg,#0f2e1c,#081a11);border:1px solid rgba(49,255,138,.35);box-shadow:0 0 26px -8px rgba(49,255,138,.35)}
  .stat.accent .k{color:rgba(49,255,138,.7)}
  .stat.accent .v{color:var(--forest)}
  .stat.accent .hint{color:rgba(232,251,240,.65)}
  .stat.warn{background:linear-gradient(160deg,#0d2530,#081419);border:1px solid rgba(47,216,255,.35);box-shadow:0 0 26px -8px rgba(47,216,255,.35)}
  .stat.warn .k{color:rgba(47,216,255,.7)}
  .stat.warn .v{color:var(--gold)}
  .stat.warn .hint{color:rgba(232,251,240,.65)}

  .formrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
  input,select,textarea{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(47,93,80,.12)}
  .btn{font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;border:none;border-radius:10px;
    padding:10px 18px;background:var(--forest);color:#03150c;transition:transform .1s,filter .15s;white-space:nowrap;
    box-shadow:0 0 18px -4px rgba(49,255,138,.55)}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);color:#021a22;box-shadow:0 0 18px -4px rgba(47,216,255,.55)}
  .btn.ghost{background:transparent;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--forest)}
  .btn.sm{padding:7px 12px;font-size:13px}

  .list{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
  .row .meta{flex:1;min-width:0}
  .row .meta .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta .s{font-size:12.5px;color:var(--ink-soft)}
  .row .amt{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
  .row .amt.pos{color:var(--forest)}
  .row .amt.neg{color:var(--coral)}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
  .tag.ok{background:var(--mint);color:var(--forest)}
  .tag.warn{background:var(--amber-soft);color:var(--gold)}
  .tag.bad{background:var(--coral-soft);color:var(--coral)}
  .x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:17px;width:30px;height:30px;border-radius:8px;flex:none}
  .x:hover{background:var(--coral-soft);color:var(--coral)}
  .empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:14px}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5}

  .bar{height:9px;background:var(--paper-2);border-radius:99px;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:99px;background:var(--forest);transition:width .5s ease}

  .sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sectionhead .lead{font-family:var(--display);font-size:21px;font-weight:600}
  .sectionhead .desc{font-size:13.5px;color:var(--ink-soft);max-width:560px}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer}
  .chip.on{background:var(--forest);color:#03150c;border-color:var(--forest)}

  /* Item card (kanban-ish) */
  .itemcard{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--paper);position:relative}
  .itemcard .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .itemcard .nm{font-family:var(--display);font-weight:600;font-size:16px}
  .itemcard .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .itemcard .stage{display:flex;gap:5px;margin:10px 0}
  .stagept{flex:1;height:5px;border-radius:99px;background:var(--paper-2)}
  .stagept.done{background:var(--forest)}
  .stagept.cur{background:var(--gold)}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:3px 0}
  .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
  .itemcard .foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .days-badge{position:absolute;top:14px;right:44px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}

  .donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;min-width:150px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .lt{flex:1;color:var(--ink-soft)}
  .legend .lv{font-weight:600;font-variant-numeric:tabular-nums}

  .loader{display:grid;place-items:center;height:60vh;color:var(--ink-soft);gap:14px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .footnote{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:36px}

  @media(max-width:760px){
    .g3{grid-template-columns:1fr}
    .g2{grid-template-columns:1fr}
    .brand h1{font-size:22px}
    nav.tabs button{padding:10px 11px;font-size:13.5px}
  }
</style>

<div id="app">
  <div class="loader"><div class="spin"></div><div>Carregando seu giro…</div></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  const storage = (window.storage) ? window.storage : (function(){
    const mem={};
    return {
      get:async(k)=> (k in mem)?{key:k,value:mem[k],shared:false}:null,
      set:async(k,v)=>{mem[k]=v;return{key:k,value:v,shared:false};},
      delete:async(k)=>{delete mem[k];return{key:k,deleted:true};},
      list:async()=>({keys:Object.keys(mem)})
    };
  })();
  async function load(key, fb){
    try{ const r=await storage.get(key,true); return (r&&r.value!=null)?JSON.parse(r.value):fb; }
    catch(e){ return fb; }
  }
  async function save(key, data, attempt){
    attempt = attempt||0;
    try{
      const r = await storage.set(key, JSON.stringify(data), true);
      if(!r) throw new Error('resposta vazia do storage');
    }catch(e){
      if(attempt < 2){
        await new Promise(res=>setTimeout(res, 350*(attempt+1)));
        return save(key, data, attempt+1);
      }
      console.error('save '+key+' falhou após 3 tentativas', e);
    }
  }

  /* ---------- state ---------- */
  const State = {
    items: [],       // ver shape abaixo
    config: { valorHora: 25, diasEncalhe: 30, margemA: 25, margemB: 30 },
    refItems: []     // tabela de preços de referência (itens de giro rápido)
  };
  /* Item: {
       id, name, cat, dateCompra, custoAquisicao, custoReforma, horas,
       dateAnuncio, precoAnuncio, plataforma,
       dateVenda, precoVenda, taxaPlataformaPct, frete, freteQuemPaga,
       status: 'comprado'|'reforma'|'anunciado'|'vendido', obs
     } */

  let filterStatus = 'ativos';   // ativos|vendido|todos
  let editingId = null;
  let formCollapsed = false;

  const CATS = ["Móveis","Eletrônicos","Eletrodomésticos","Decoração","Roupas e calçados","Ferramentas","Instrumentos musicais","Bicicletas","Videogames","Celulares","Brinquedos","Livros","Utensílios de cozinha","Antiguidades/colecionáveis","Outros"];
  const PLATAFORMAS = ["Facebook Marketplace","Mercado Livre","OLX","Enjoei","Instagram","Venda direta","Outro"];
  const CAT_ICON = {"Móveis":"🪑","Eletrônicos":"💻","Eletrodomésticos":"🔌","Decoração":"🖼️","Roupas e calçados":"👕","Ferramentas":"🔧","Instrumentos musicais":"🎸","Bicicletas":"🚲","Videogames":"🎮","Celulares":"📱","Brinquedos":"🧸","Livros":"📚","Utensílios de cozinha":"🍳","Antiguidades/colecionáveis":"🏺","Outros":"📦"};

  const CATALOGO_SUGERIDO = [
    {name:"PlayStation 2", cat:"Videogames"},
    {name:"PlayStation 3", cat:"Videogames"},
    {name:"PlayStation 4", cat:"Videogames"},
    {name:"PlayStation 5", cat:"Videogames"},
    {name:"Bicicleta aro 29", cat:"Bicicletas"},
    {name:"iPhone 11", cat:"Celulares"},
    {name:"iPhone 12", cat:"Celulares"},
    {name:"iPhone 13", cat:"Celulares"}
  ];
  const PALETTE = ["#31ff8a","#2fd8ff","#ff2f5e","#a6ff5e","#7a5cff","#ffd23f","#ff7a3f","#5eeaff","#ff5ea6","#8affc1"];

  /* ---------- helpers ---------- */
  function fmt(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function fmtShort(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ if(!a) return 0; const d1=new Date(a+'T00:00'), d2=new Date((b||todayISO())+'T00:00'); return Math.round((d2-d1)/86400000); }
  function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
  function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }

  const STAGES = ['comprado','reforma','anunciado','vendido'];
  const STAGE_LABEL = {comprado:'Comprado',reforma:'Em reforma',anunciado:'Anunciado',vendido:'Vendido'};

  /* custo total investido no item até agora (independente de ter vendido) */
  function custoBase(it){
    return (it.custoAquisicao||0) + (it.custoReforma||0) + (it.horas||0)*(State.config.valorHora||0);
  }
  /* taxa da plataforma calculada sobre o preço de venda */
  function taxaValor(it){
    if(!it.precoVenda) return 0;
    return (it.precoVenda * (it.taxaPlataformaPct||0))/100;
  }
  function freteValor(it){
    if(it.freteQuemPaga==='vendedor') return it.frete||0;
    return 0;
  }
  function custoTotal(it){ return custoBase(it) + taxaValor(it) + freteValor(it); }
  function lucroLiquido(it){
    if(it.status!=='vendido') return null;
    return (it.precoVenda||0) - custoTotal(it);
  }
  function margemPct(it){
    const l = lucroLiquido(it);
    if(l==null || !it.precoVenda) return null;
    return (l/it.precoVenda)*100;
  }
  function reaisPorHora(it){
    const l = lucroLiquido(it);
    if(l==null || !it.horas) return null;
    return l/it.horas;
  }
  function diasCiclo(it){
    if(it.status==='vendido' && it.dateVenda) return daysBetween(it.dateCompra, it.dateVenda);
    return daysBetween(it.dateCompra, todayISO());
  }
  function isEncalhado(it){
    return it.status!=='vendido' && diasCiclo(it) > (State.config.diasEncalhe||30);
  }

  /* Preço de venda para atingir uma margem de lucro sobre o preço de venda (não sobre o custo).
     Ex.: pago R$100, margem 25% -> venda = 100/(1-0.25) = R$133,33 (lucro de R$33,33 = 25% dos R$133,33) */
  function precoVendaMargem(custo, margemPct){
    const m = (margemPct||0)/100;
    if(m>=1) return null;
    return custo/(1-m);
  }

  /* ---------- DOM root ---------- */
  const app = document.getElementById('app');

  function shell(){
    app.innerHTML = `
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="seal">↻</div>
          <div>
            <h1>Giro &amp; Margem</h1>
            <div class="sub">Controle de compra, reforma e revenda por item</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="chip" id="cfgBtn">⚙ Configurações</button>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button data-tab="dash" class="active">Visão geral</button>
        <button data-tab="itens">Itens</button>
        <button data-tab="analise">Análise</button>
        <button data-tab="ref">Tabela de Preços</button>
      </nav>

      <section id="sec-dash" class="show"></section>
      <section id="sec-itens"></section>
      <section id="sec-analise"></section>
      <section id="sec-ref"></section>

      <div class="footnote">Dados salvos automaticamente e compartilhados entre quem abrir este link — sincroniza em qualquer aparelho.</div>
    </div>`;

    document.querySelectorAll('#tabs button').forEach(b=>{ b.onclick=()=>switchTab(b.dataset.tab,b); });
    document.getElementById('cfgBtn').onclick = editConfig;
    renderAll();
  }

  function switchTab(tab, btn){
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section').forEach(s=>s.classList.remove('show'));
    document.getElementById('sec-'+tab).classList.add('show');
  }

  function editConfig(){
    const vh = prompt("Valor da sua hora de trabalho (R$) — usado para calcular o custo real do seu tempo em cada item:", State.config.valorHora);
    if(vh===null) return;
    const de = prompt("A partir de quantos dias sem vender um item vira 'encalhado'?", State.config.diasEncalhe);
    if(de===null) return;
    const ma = prompt("Margem de lucro A — a menor da faixa recomendada (%), usada na Tabela de Preços:", State.config.margemA);
    if(ma===null) return;
    const mb = prompt("Margem de lucro B — a maior da faixa recomendada (%), usada na Tabela de Preços:", State.config.margemB);
    if(mb===null) return;
    State.config.valorHora = parseFloat(vh)||0;
    State.config.diasEncalhe = parseInt(de)||30;
    State.config.margemA = parseFloat(ma)||25;
    State.config.margemB = parseFloat(mb)||30;
    save('config', State.config);
    renderAll();
  }

  function renderAll(){ renderDash(); renderItens(); renderAnalise(); renderRef(); }

  /* ==================== DASHBOARD ==================== */
  function renderDash(){
    const ativos = State.items.filter(it=>it.status!=='vendido');
    const vendidos = State.items.filter(it=>it.status==='vendido');

    const capitalParado = sum(ativos.map(custoBase));
    const lucroRealizado = sum(vendidos.map(it=>lucroLiquido(it)||0));
    const encalhados = ativos.filter(isEncalhado);
    const capitalEncalhado = sum(encalhados.map(custoBase));

    const now = new Date();
    const thisMonth = now.toISOString().slice(0,7);
    const vendidosMes = vendidos.filter(it=>(it.dateVenda||'').slice(0,7)===thisMonth);
    const lucroMes = sum(vendidosMes.map(it=>lucroLiquido(it)||0));

    const cicloMedio = vendidos.length ? Math.round(sum(vendidos.map(diasCiclo))/vendidos.length) : null;

    const byCat={};
    ativos.forEach(it=>{ byCat[it.cat]=(byCat[it.cat]||0)+custoBase(it); });
    const catsAtivos = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

    document.getElementById('sec-dash').innerHTML = `
      <div class="sectionhead">
        <div><div class="lead">Visão geral</div>
        <div class="desc">A pergunta que importa não é "quanto tenho pra vender" — é quanto do seu dinheiro está parado em estoque agora, contra quanto já virou lucro de verdade.</div></div>
      </div>

      <div class="grid g3" style="margin-bottom:16px">
        <div class="card stat warn"><div class="k">Capital parado em estoque</div><div class="v">${fmt(capitalParado)}</div><div class="hint">${ativos.length} item(ns) ainda não vendido(s)</div></div>
        <div class="card stat accent"><div class="k">Lucro realizado (total)</div><div class="v">${fmt(lucroRealizado)}</div><div class="hint">${vendidos.length} item(ns) vendido(s) · ${fmt(lucroMes)} este mês</div></div>
        <div class="card stat"><div class="k">Giro médio</div><div class="v">${cicloMedio!=null?cicloMedio+' dias':'—'}</div><div class="hint">tempo médio entre compra e venda</div></div>
      </div>

      ${encalhados.length? `<div class="card" style="margin-bottom:16px;border-color:var(--coral)">
        <h3>🚨 Itens encalhados (${encalhados.length})</h3>
        <div class="desc" style="margin-bottom:10px">Parados há mais de ${State.config.diasEncalhe} dias sem vender. Juntos, prendem <b>${fmt(capitalEncalhado)}</b> que poderiam virar caixa ou novo giro.</div>
        <div class="list">${encalhados.sort((a,b)=>diasCiclo(b)-diasCiclo(a)).slice(0,6).map(it=>`
          <div class="row">
            <div class="dot" style="background:var(--coral-soft);color:var(--coral)">${CAT_ICON[it.cat]||'📦'}</div>
            <div class="meta"><div class="t">${esc(it.name)}</div><div class="s">${diasCiclo(it)} dias parado · ${esc(STAGE_LABEL[it.status])}</div></div>
            <div class="amt neg">${fmtShort(custoBase(it))}</div>
          </div>`).join("")}</div>
      </div>` : `<div class="card" style="margin-bottom:16px"><div class="empty"><div class="big">✅</div>Nenhum item encalhado (limite: ${State.config.diasEncalhe} dias). Giro saudável.</div></div>`}

      <div class="grid g2">
        <div class="card">
          <h3>📦 Onde está o capital parado</h3>
          ${catsAtivos.length? donut(catsAtivos, sum(catsAtivos.map(c=>c[1]))) : `<div class="empty"><div class="big">🌱</div>Nenhum item ativo no momento.</div>`}
        </div>
        <div class="card">
          <h3>📌 Funil atual</h3>
          ${STAGES.filter(s=>s!=='vendido').map(s=>{
            const n = ativos.filter(it=>it.status===s).length;
            const v = sum(ativos.filter(it=>it.status===s).map(custoBase));
            return `<div class="kv" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${STAGE_LABEL[s]}</span><b>${n} item(ns) · ${fmt(v)}</b></div>`;
          }).join("")}
          <div class="kv" style="padding:8px 0"><span>Anunciados aguardando comprador</span><b>${ativos.filter(it=>it.status==='anunciado').length}</b></div>
        </div>
      </div>`;
  }

  function donut(cats, total){
    const size=150, r=58, cx=size/2, cy=size/2, sw=24, C=2*Math.PI*r;
    let acc=0, segs="";
    cats.forEach(([cat,val],i)=>{
      const frac=val/total, off=C*(1-frac), rot=acc*360-90; acc+=frac;
      segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PALETTE[i%PALETTE.length]}"
        stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${off}"
        transform="rotate(${rot} ${cx} ${cy})" stroke-linecap="butt"/>`;
    });
    const legend = cats.slice(0,7).map(([cat,val],i)=>`
      <div class="li"><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span>
      <span class="lt">${esc(cat)}</span><span class="lv">${Math.round(val/total*100)}%</span></div>`).join("");
    return `<div class="donutwrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="${sw}"/>
        ${segs}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="var(--display)" font-size="13" fill="var(--ink-soft)">Total</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="var(--display)" font-weight="600" font-size="15" fill="var(--ink)">${fmtShort(total)}</text>
      </svg>
      <div class="legend">${legend}</div></div>`;
  }

  /* ==================== ITENS ==================== */
  function renderItens(){
    const sec = document.getElementById('sec-itens');
    let list = State.items.slice();
    if(filterStatus==='ativos') list = list.filter(it=>it.status!=='vendido');
    else if(filterStatus==='vendido') list = list.filter(it=>it.status==='vendido');
    list.sort((a,b)=> (b.dateCompra||'').localeCompare(a.dateCompra||''));

    sec.innerHTML = `
      <div class="sectionhead">
        <div><div class="lead">Itens</div>
        <div class="desc">Cada item é um ciclo: comprado → reforma → anunciado → vendido. Preencha os custos conforme forem acontecendo.</div></div>
        <button class="btn" id="newItemBtn">+ Novo item</button>
      </div>

      <div id="formArea"></div>

      <div class="filterbar">
        <span class="chip ${filterStatus==='ativos'?'on':''}" data-f="ativos">Ativos</span>

        <span class="chip ${filterStatus==='todos'?'on':''}" data-f="todos">Todos</span>

      ${list.length? `<div class="grid g3">${list.map(it=>itemCardHtml(it)).join("")}</div>`

    `;

    sec.querySelector('#newItemBtn').onclick = ()=>{ editingId='new'; renderForm(); };
    sec.querySelectorAll('[data-f]').forEach(c=> c.onclick=()=>{ filterStatus=c.dataset.f; renderItens(); });
    sec.querySelectorAll('[data-edit]').forEach(b=> b.onclick=()=>{ editingId=b.dataset.edit; renderForm(); });
    sec.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{ if(confirm('Remover este item?')) delItem(b.dataset.del); });
    sec.querySelectorAll('[data-advance]').forEach(b=> b.onclick=()=>{ advanceStage(b.dataset.advance); });
    if(editingId) renderForm();

  function itemCardHtml(it){
    const stageIdx = STAGES.indexOf(it.status);
    const dias = diasCiclo(it);
    const encalhado = isEncalhado(it);
    const l = lucroLiquido(it);
    const m = margemPct(it);
    const rh = reaisPorHora(it);
    let badge = '';
    if(it.status==='vendido'){
      badge = `<span class="days-badge" style="background:${l>=0?'var(--mint)':'var(--coral-soft)'};color:${l>=0?'var(--forest)':'var(--coral)'}">${dias}d</span>`;
    } else {
      badge = `<span class="days-badge" style="background:${encalhado?'var(--coral-soft)':'var(--paper-2)'};color:${encalhado?'var(--coral)':'var(--ink-soft)'}">${dias}d</span>`;
    }
    return `<div class="itemcard">
      ${badge}
      <div class="ih">
        <div><div class="nm">${esc(it.name)}</div><div class="sub">${CAT_ICON[it.cat]||'📦'} ${esc(it.cat)}</div></div>
        <button class="x" data-del="${it.id}" title="Remover">✕</button>
      </div>
      <div class="stage">${STAGES.map((s,i)=>`<div class="stagept ${i<stageIdx?'done':(i===stageIdx?'cur':'')}"></div>`).join("")}</div>
      <div class="kv"><span>Etapa</span><b>${STAGE_LABEL[it.status]}${encalhado?' · <span style="color:var(--coral)">encalhado</span>':''}</b></div>
      <div class="kv"><span>Custo até agora</span><b>${fmt(custoBase(it))}</b></div>
      ${it.status==='vendido' ? `
        <div class="kv"><span>Vendido por</span><b>${fmt(it.precoVenda)}</b></div>
        <div class="kv"><span>Lucro líquido</span><b style="color:${l>=0?'var(--forest)':'var(--coral)'}">${fmt(l)}</b></div>
        <div class="kv"><span>Margem</span><b>${m!=null?Math.round(m)+'%':'—'}</b></div>
        ${rh!=null?`<div class="kv"><span>R$/hora do seu tempo</span><b>${fmt(rh)}</b></div>`:''}
      ` : `
        ${it.precoAnuncio?`<div class="kv"><span>Anunciado por</span><b>${fmt(it.precoAnuncio)}</b></div>`:''}
      `}
      <div class="foot">
        <button class="btn sm ghost" data-edit="${it.id}">Editar</button>
        ${it.status!=='vendido' ? `<button class="btn sm gold" data-advance="${it.id}">${it.status==='comprado'?'→ Em reforma':it.status==='reforma'?'→ Anunciado':'→ Vendido'}</button>` : ''}
      </div>
    </div>`;
  }

  function advanceStage(id){
    const it = State.items.find(x=>x.id===id); if(!it) return;
    const idx = STAGES.indexOf(it.status);
    if(idx>=STAGES.length-1) return;
    const next = STAGES[idx+1];
    if(next==='anunciado' && !it.dateAnuncio){
      const p = prompt('Preço de anúncio (R$):', it.precoAnuncio||'');
      if(p===null) return;
      it.precoAnuncio = parseFloat(p)||0;
      it.dateAnuncio = todayISO();
      const plat = prompt('Plataforma de venda ('+PLATAFORMAS.join(', ')+'):', it.plataforma||PLATAFORMAS[0]);
      if(plat!==null) it.plataforma = plat;
    }
    if(next==='vendido'){
      const p = prompt('Preço final de venda (R$):', it.precoAnuncio||'');
      if(p===null) return;
      it.precoVenda = parseFloat(p)||0;
      it.dateVenda = todayISO();
      if(!it.taxaPlataformaPct){
        const tx = prompt('Taxa da plataforma sobre a venda (%):', it.taxaPlataformaPct||0);
        it.taxaPlataformaPct = parseFloat(tx)||0;
      }
    }
    it.status = next;
    save('items', State.items);
    renderAll();
  }

          <div class="field" style="flex:0 0 150px"><label>Custo de reforma (R$)</label><input id="fReforma" type="number" min="0" step="0.01" value="${it.custoReforma||0}"></div>

          <div class="field" style="flex:0 0 180px"><label>Plataforma de venda</label><select id="fPlataforma">${PLATAFORMAS.map(p=>`<option ${p===it.plataforma?'selected':''}>${p}</option>`).join("")}</select></div>
        </div>

          <div class="field" style="flex:0 0 130px"><label>Taxa plataforma (%)</label><input id="fTaxa" type="number" min="0" step="0.1" value="${it.taxaPlataformaPct||0}"></div>
          <div class="field" style="flex:0 0 120px"><label>Frete (R$)</label><input id="fFrete" type="number" min="0" step="0.01" value="${it.frete||0}"></div>
          <div class="field" style="flex:0 0 130px"><label>Frete pago por</label>
            <select id="fFreteQuem"><option value="vendedor" ${it.freteQuemPaga==='vendedor'?'selected':''}>Você (vendedor)</option><option value="comprador" ${it.freteQuemPaga==='comprador'?'selected':''}>Comprador</option></select></div>
        </div>
        <div class="field" style="margin-bottom:12px"><label>Observações</label><textarea id="fObs" rows="2" placeholder="Detalhes, onde comprou, etc.">${esc(it.obs||'')}</textarea></div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="fSave">Salvar</button>
          <button class="btn ghost" id="fCancel">Cancelar</button>
        </div>
      </div>`;

    area.querySelector('#fSave').onclick = ()=>{
      const g=id=>document.getElementById(id);
      const name = g('fName').value.trim();
      if(!name){ g('fName').focus(); return; }
      it.name = name;
      it.cat = g('fCat').value;
      it.dateCompra = g('fDataCompra').value||todayISO();
      it.custoAquisicao = parseFloat(g('fAquisicao').value)||0;
      it.custoReforma = parseFloat(g('fReforma').value)||0;
      it.horas = parseFloat(g('fHoras').value)||0;
      it.status = g('fStatus').value;
      it.precoAnuncio = parseFloat(g('fPrecoAnuncio').value)||0;
      it.plataforma = g('fPlataforma').value;
      it.dateVenda = g('fDataVenda').value||'';
      it.precoVenda = parseFloat(g('fPrecoVenda').value)||0;
      it.taxaPlataformaPct = parseFloat(g('fTaxa').value)||0;
      it.frete = parseFloat(g('fFrete').value)||0;

      it.obs = g('fObs').value.trim();

      if(isNew) State.items.push(it);
      save('items', State.items);
      editingId = null;
      renderAll();
    };
    area.querySelector('#fCancel').onclick = ()=>{ editingId=null; renderItens(); };
  }

  function delItem(id){
    State.items = State.items.filter(it=>it.id!==id);
    save('items', State.items);
    renderAll();
  }

  /* ==================== ANÁLISE ==================== */
  function renderAnalise(){
    const sec = document.getElementById('sec-analise');
    const vendidos = State.items.filter(it=>it.status==='vendido');

    if(!vendidos.length){
      sec.innerHTML = `<div class="sectionhead"><div><div class="lead">Análise</div>
        <div class="desc">Assim que você tiver itens vendidos, aqui aparece o que realmente dá retorno — por categoria, por plataforma e por R$/hora do seu tempo.</div></div></div>
        <div class="card"><div class="empty"><div class="big">📊</div>Nenhuma venda registrada ainda.</div></div>`;
      return;
    }

    // por categoria
    const byCat={};
    vendidos.forEach(it=>{
      const c=it.cat; byCat[c]=byCat[c]||{lucro:0,n:0,horas:0,receita:0};
      byCat[c].lucro += lucroLiquido(it)||0; byCat[c].n++; byCat[c].horas += it.horas||0; byCat[c].receita += it.precoVenda||0;
    });
    const catRank = Object.entries(byCat).map(([c,d])=>({cat:c, ...d, rh: d.horas? d.lucro/d.horas : null, margem: d.receita? (d.lucro/d.receita*100):null}))
      .sort((a,b)=>b.lucro-a.lucro);

    // por plataforma
    const byPlat={};
    vendidos.forEach(it=>{
      const p=it.plataforma||'—'; byPlat[p]=byPlat[p]||{lucro:0,n:0,receita:0,taxas:0};
      byPlat[p].lucro += lucroLiquido(it)||0; byPlat[p].n++; byPlat[p].receita += it.precoVenda||0; byPlat[p].taxas += taxaValor(it);
    });
    const platRank = Object.entries(byPlat).map(([p,d])=>({plat:p, ...d, margem: d.receita? (d.lucro/d.receita*100):null}))
      .sort((a,b)=>b.lucro-a.lucro);

    const totalLucro = sum(vendidos.map(it=>lucroLiquido(it)||0));
    const totalHoras = sum(vendidos.map(it=>it.horas||0));
    const rhGeral = totalHoras? totalLucro/totalHoras : null;
    const piorItem = vendidos.slice().sort((a,b)=>(lucroLiquido(a)||0)-(lucroLiquido(b)||0))[0];
    const melhorItem = vendidos.slice().sort((a,b)=>(lucroLiquido(b)||0)-(lucroLiquido(a)||0))[0];

    sec.innerHTML = `
      <div class="sectionhead">
        <div><div class="lead">Análise</div>
        <div class="desc">Onde o seu tempo e capital realmente rendem — para decidir o que comprar e onde vender mais.</div></div>
      </div>

      <div class="grid g3" style="margin-bottom:16px">
        <div class="card stat"><div class="k">R$/hora médio geral</div><div class="v ${rhGeral!=null&&rhGeral<0?'neg':'pos'}">${rhGeral!=null?fmt(rhGeral):'—'}</div><div class="hint">${totalHoras}h registradas no total</div></div>
        <div class="card stat"><div class="k">Melhor item</div><div class="v" style="font-size:18px">${melhorItem?esc(melhorItem.name):'—'}</div><div class="hint">${melhorItem?fmt(lucroLiquido(melhorItem))+' de lucro':''}</div></div>
        <div class="card stat"><div class="k">Pior item</div><div class="v" style="font-size:18px">${piorItem?esc(piorItem.name):'—'}</div><div class="hint">${piorItem?fmt(lucroLiquido(piorItem))+' de lucro':''}</div></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h3>🏆 Ranking por categoria</h3>
        <div class="desc" style="margin-bottom:10px">Ordenado por lucro total. R$/hora mostra o retorno real do seu tempo em cada tipo de item.</div>
        <div class="list">${catRank.map(r=>`
          <div class="row">
            <div class="dot" style="background:var(--mint);color:var(--forest)">${CAT_ICON[r.cat]||'📦'}</div>
            <div class="meta"><div class="t">${esc(r.cat)}</div>
              <div class="s">${r.n} vendido(s) · margem ${r.margem!=null?Math.round(r.margem)+'%':'—'}${r.rh!=null?' · '+fmt(r.rh)+'/h':''}</div></div>
            <div class="amt ${r.lucro>=0?'pos':'neg'}">${fmt(r.lucro)}</div>
          </div>`).join("")}</div>
      </div>

      <div class="card">
        <h3>🛒 Ranking por plataforma de venda</h3>
        <div class="desc" style="margin-bottom:10px">Compara canais descontando a taxa efetiva de cada um.</div>
        <div class="list">${platRank.map(r=>`
          <div class="row">
            <div class="dot" style="background:var(--paper-2);color:var(--ink-soft)">🛍️</div>
            <div class="meta"><div class="t">${esc(r.plat)}</div>
              <div class="s">${r.n} venda(s) · ${fmt(r.taxas)} em taxas · margem ${r.margem!=null?Math.round(r.margem)+'%':'—'}</div></div>
            <div class="amt ${r.lucro>=0?'pos':'neg'}">${fmt(r.lucro)}</div>
          </div>`).join("")}</div>
      </div>`;
  }

              <td style="padding:8px 6px;text-align:right;font-family:var(--mono);color:var(--forest)">${vA!=null?fmt(vA):'—'}</td>
              <td style="padding:8px 6px;text-align:right;font-family:var(--mono);color:var(--gold)">${vB!=null?fmt(vB):'—'}</td>
              <td style="padding:8px 6px;text-align:right"><button class="x refDel" data-id="${r.id}" title="Remover">✕</button></td>
            </tr>`;
          }).join("") : `<tr><td colspan="6"><div class="empty"><div class="big">🏷️</div>Nenhum item na tabela ainda.</div></td></tr>`}
          </tbody>
        </table>
      </div>`;

    sec.querySelector('#refAddBtn').onclick = ()=>{
      const name = prompt("Nome do item (ex.: PlayStation 4, iPhone 12, Bicicleta aro 29):");
      if(!name || !name.trim()) return;
      const cat = prompt("Categoria (" + CATS.join(", ") + "):", "Videogames") || "Outros";
      const catFinal = CATS.includes(cat) ? cat : "Outros";
      State.refItems.push({id:uid(), name:name.trim(), cat:catFinal, precoPago:0});
      save('refItems', State.refItems);
      renderRef();
    };

    sec.querySelectorAll('.refPago').forEach(inp=>{
      inp.onchange = ()=>{
        const id = inp.dataset.id;
        const item = State.refItems.find(r=>r.id===id);
        if(item){ item.precoPago = parseFloat(inp.value)||0; save('refItems', State.refItems); renderRef(); }
      };
    });
    sec.querySelectorAll('.refDel').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.id;
        State.refItems = State.refItems.filter(r=>r.id!==id);
        save('refItems', State.refItems);
        renderRef();
      };
    });
  }

  /* ---------- init ---------- */
  (async function init(){
    State.items = await load('items', []);
    State.config = await load('config', State.config);
    State.refItems = await load('refItems', null);
    if(State.refItems===null){
      // primeira vez: pré-carrega o catálogo sugerido em memória (sem salvar ainda,
      // pra não disparar 3 gravações simultâneas no primeiro carregamento).
      // Será salvo automaticamente assim que você editar ou adicionar um item.
      State.refItems = CATALOGO_SUGERIDO.map(c=>({id:uid(), name:c.name, cat:c.cat, precoPago:0}));
    }
    shell();
  })();
})();
</script>
